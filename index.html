<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e231c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zombis">
<meta name="description" content="Juego de zombis para celular: muévete agachado, tu arma dispara sola al zombi más cercano.">
<title>Calles Muertas – Juego de zombis</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hud-left">
    <div class="hp"><div id="hpFill" class="hp-fill"></div><span id="hpText" class="hp-text">100</span></div>
    <div class="stats">
      <span class="kills">☠ <b id="kills">0</b></span>
      <span class="ammo" id="ammo">12 / ∞</span>
    </div>
  </div>
  <button id="pauseBtn" class="round-btn" aria-label="Pausa">❚❚</button>
</div>

<div id="damage" class="damage"></div>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>CALLES<br><span>MUERTAS</span></h1>
    <p>Muévete agachado con el dedo.<br>Tu arma dispara sola al zombi más cercano.</p>
    <button id="startBtn" class="big-btn">JUGAR</button>
    <p class="small">Entrega 1 · prototipo</p>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="panel">
    <h2>PAUSA</h2>
    <button id="resumeBtn" class="big-btn">CONTINUAR</button>
    <button id="restartBtn2" class="big-btn alt">REINICIAR</button>
  </div>
</div>

<div id="gameover" class="overlay hidden">
  <div class="panel">
    <h2 class="red">TE ATRAPARON</h2>
    <p>Zombis eliminados: <b id="goKills">0</b></p>
    <p>Tiempo vivo: <b id="goTime">0:00</b></p>
    <button id="restartBtn" class="big-btn">REINTENTAR</button>
  </div>
</div>

<script src="js/game.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (r) { window.__swRegistered = true; })
      .catch(function (e) { console.warn('SW no registrado', e); });
  });
}
</script>
</body>
</html>
